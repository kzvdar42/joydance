<!doctype html>
<!-- Copy into static/ and serve static/ to run this browser regression check. No hardware or live WebSocket is used. -->
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/css/pure-min.css"><link rel="stylesheet" href="/css/app.css">
<script src="/js/mitt.umd.js"></script><title>Controller UI regression check</title></head>
<body><script type="module">
import { render } from '/js/preact.module.js';
import { html } from '/js/utils.js';
import { Controllers } from '/js/components/controller.js';
import { WsCommand } from '/js/consts.js';

window.PAIRING_RULES = await (await fetch('/pairing_rules.json')).json();
window.CONFIG = {pairing_method:'default',host_ip_addr:'192.168.1.2',console_ip_addr:'192.168.1.3',pairing_code:'123456'};
window.VERSION = 'UI regression check';
const sent = [];
const sockets = [];
window.WebSocket = class {
    static OPEN = 1;
    static CLOSED = 3;
    constructor() { this.readyState = 1; window.testSocket = this; sockets.push(this); }
    send(message) { sent.push(JSON.parse(message)); }
    close() { this.readyState = 3; this.onclose?.({wasClean:true}); }
};
const controllers = [
    {serial:'left',name:'JoyCon L',controller_type:'joycon_left',color:'#19bee4'},
    {serial:'right',name:'JoyCon R',controller_type:'joycon_right',color:'#ef483e'},
    {serial:'pro',name:'Pro Controller',controller_type:'pro_controller',color:'#383638',color_buttons:'#222'},
].map(controller=>({...controller,state:0,battery_level:4,rumble_enabled:true,
    motion_settings:{idle_imu_shutdown:true,gyro_shutdown:false},gyro_shutdown_available:false}));
const settle = () => new Promise(resolve=>requestAnimationFrame(()=>requestAnimationFrame(resolve)));
const check = (condition, message) => { if (!condition) throw new Error(message); };
const checkActionsLayout = row => {
    const actions = row.querySelector('.controller-actions');
    const mainButton = actions.querySelector('button');
    const main = mainButton.getBoundingClientRect();
    const label = document.createRange();
    label.selectNodeContents(mainButton);
    const style = getComputedStyle(mainButton);
    check(label.getBoundingClientRect().width <= main.width - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight),
        'Connection button labels must fit without clipping');
    const utility = actions.querySelector('.controller-utility-actions').getBoundingClientRect();
    check([...actions.querySelectorAll('.icon-button')].every(button => {
        const icon = button.getBoundingClientRect();
        return icon.width === main.height && icon.height === main.height;
    }), 'Icon buttons must be square and match the text button height');
    if (matchMedia('(max-width: 450px)').matches) {
        check(Math.abs(main.top - utility.top) < 1 && Math.abs(utility.left - main.right - 8) < 1,
            'Mobile connection and utility buttons must share a row with an 8px gap');
        check(Math.abs(utility.right - actions.getBoundingClientRect().right) < 1,
            'Mobile actions must fill the available width');
    } else {
        check(Math.abs(main.width - utility.width) < 1 && utility.top > main.bottom,
            'Desktop connection button must match the combined utility button width');
    }
};
const refresh = () => document.querySelector('.btn-refresh');
const updateEvent = 'resp_' + WsCommand.UPDATE_CONTROLLER_STATE;
const settingsEvent = 'resp_' + WsCommand.SAVE_CONTROLLER_SETTINGS;
const listeners = event => window.mitty.all.get(event)?.length || 0;
const reply = list => window.testSocket.onmessage({data:JSON.stringify({cmd:'resp_' + WsCommand.GET_CONTROLLER_LIST,data:list})});

try {
    await import('/js/app.js');
    window.testSocket.onopen({});
    reply(controllers);
    await settle();
    check(listeners(updateEvent) === 3, 'Each row must have one state listener');
    check(listeners(settingsEvent) === 3, 'Each settings popup must have one save listener');
    check(refresh().querySelector('svg[aria-hidden="true"]') && refresh().getAttribute('aria-label') === 'Refresh controllers',
        'Refresh icon must retain its accessible action name');
    const settingsRow = document.querySelector('[aria-label="Joy-Con left"]').closest('li');
    const settingsPanel = settingsRow.querySelector('.controller-settings');
    const settingsButton = settingsRow.querySelector('.controller-settings-button');
    const rumbleButton = settingsRow.querySelector('.controller-rumble-button');
    checkActionsLayout(settingsRow);
    check(rumbleButton.nextElementSibling === settingsButton && rumbleButton.title === 'Rumble on',
        'Idle controllers must show the rumble icon immediately before Settings');
    check(!rumbleButton.querySelector('path[stroke]'), 'Enabled rumble must use the unslashed icon');
    rumbleButton.click();
    check(sent.at(-1).cmd === WsCommand.TOGGLE_RUMBLE && sent.at(-1).data.enabled === false,
        'Idle controllers must be able to toggle rumble');
    window.mitty.emit(updateEvent, {...controllers[0], rumble_enabled:false});
    await settle();
    check(rumbleButton.getAttribute('aria-pressed') === 'false' && rumbleButton.title === 'Rumble off',
        'Rumble icon must reflect the server state');
    check(rumbleButton.querySelector('path[stroke]'), 'Disabled rumble must show a diagonal slash');
    window.mitty.emit(updateEvent, {...controllers[0], rumble_enabled:true});
    await settle();
    check(!rumbleButton.querySelector('path[stroke]'), 'Re-enabling rumble must remove the slash');
    check(settingsButton.querySelector('svg[aria-hidden="true"]') && settingsButton.title === 'Settings'
        && settingsButton.getAttribute('aria-label') === 'JoyCon L settings',
        'Settings icon must retain a tooltip and an accessible action name');
    check(!settingsPanel.open, 'Settings popup must start closed');
    const closeSettings = settingsPanel.querySelector('.controller-settings-heading button');
    check(closeSettings.querySelector('svg[aria-hidden="true"]') && closeSettings.title === 'Close'
        && closeSettings.getAttribute('aria-label') === 'Close JoyCon L settings',
        'Settings close icon must retain a tooltip and an accessible action name');
    settingsButton.focus();
    settingsButton.click();
    check(settingsPanel.open && settingsPanel.matches(':modal'), 'Settings button must open a modal popup');
    check(settingsPanel.contains(document.activeElement), 'Opening settings must move keyboard focus into the popup');
    check(settingsPanel.querySelector('[name="idle_imu_shutdown"]').checked, 'Idle IMU shutdown must default to on');
    const gyro = settingsPanel.querySelector('[name="gyro_shutdown"]');
    check(!gyro.checked, 'Gyro shutdown must default to off');
    check(gyro.getBoundingClientRect().width < 30, 'Checkboxes must retain their normal width beside the labels');
    gyro.click();
    await settle();
    settingsPanel.querySelector('form').requestSubmit();
    await settle();
    check(sent.at(-1).cmd === WsCommand.SAVE_CONTROLLER_SETTINGS && sent.at(-1).data.settings.gyro_shutdown,
        'Settings form must send the selected controller and checkbox values');
    window.mitty.emit(settingsEvent, {controller_serial:'right'});
    await settle();
    check(settingsPanel.querySelector('fieldset').disabled,
        'Another controller save reply must not finish this controller save');
    window.testSocket.onmessage({data:JSON.stringify({cmd:'resp_save_controller_settings',
        data:{controller_serial:'left',error:'Test save error'}})});
    await settle();
    check(settingsPanel.textContent.includes('Test save error'), 'Save errors must appear beside controller settings');
    window.mitty.emit(updateEvent, {...controllers[0],state:4,connection_requested:true});
    await settle();
    check(!settingsPanel.querySelector('fieldset').disabled, 'Settings must remain available during a game connection');
    settingsPanel.querySelector('form').requestSubmit();
    await settle();
    check(settingsPanel.querySelector('fieldset').disabled, 'Saving must prevent duplicate requests');
    check(sent.at(-1).cmd === WsCommand.SAVE_CONTROLLER_SETTINGS,
        'A connected controller must be able to save settings');
    window.testSocket.onmessage({data:JSON.stringify({cmd:'resp_save_controller_settings', data:{controller_serial:'left'}})});
    await settle();
    settingsPanel.querySelector('.controller-settings-heading button').click();
    check(!settingsPanel.open && document.activeElement === settingsButton,
        'Closing settings must restore focus to the popup button');
    settingsButton.click();
    const escape = new Event('cancel', {cancelable:true});
    if (settingsPanel.dispatchEvent(escape)) settingsPanel.close();
    check(!settingsPanel.open, 'Settings must allow the native Escape action');
    settingsButton.click();
    settingsPanel.querySelector('[name="idle_imu_shutdown"]').click();
    await settle();
    settingsPanel.querySelector('form').requestSubmit();
    await settle();
    window.mitty.emit('ws_disconnected');
    await settle();
    check(!settingsPanel.querySelector('fieldset').disabled &&
        settingsPanel.textContent.includes('Connection lost. Refresh to check saved settings.') &&
        !settingsPanel.querySelector('[name="idle_imu_shutdown"]').checked,
        'Disconnection must release a pending save and preserve its draft settings');
    settingsPanel.querySelector('.controller-settings-heading button').click();
    reply(controllers);
    await settle();
    for (const player_color of [undefined, null, []]) {
        const jd23Controllers = controllers.map(controller => controller.serial === 'left' ? {
            ...controller, state:4, player_name:'JD26 player', player_id:2, player_color,
        } : controller);
        reply(jd23Controllers);
        await settle();
        const leftRow = document.querySelector('[aria-label="Joy-Con left"]').closest('li');
        check(document.querySelectorAll('.controllers-list li').length === 3, 'Missing player color must not hide the controller list');
        check(leftRow.querySelector('.player-info').textContent.includes('P2: JD26 player'), 'JD23 player details must render without a color');
        check(!leftRow.querySelector('.player-color'), 'Missing player color must omit only the swatch');
        window.mitty.emit(updateEvent, {...jd23Controllers[0], state:102, error_details:'Test sign-in error'});
        await settle();
        check(leftRow.querySelector('.controller-state').textContent === 'Test sign-in error', 'An error with previous JD23 player details must remain visible');
    }
    reply(controllers);
    await settle();
    const icons = [...document.querySelectorAll('.controllers-list .controller-color')];
    check(icons.map(icon=>icon.getAttribute('aria-label')).join(',') === 'Joy-Con left,Joy-Con right,Pro Controller', 'All icon variants must render');
    check(icons[2].getBoundingClientRect().width === 48 && icons[2].getBoundingClientRect().height === 36, 'Pro icon size changed');

    const requests = sent.length;
    const refreshPath = refresh().querySelector('path').getAttribute('d');
    refresh().click();
    await settle();
    check(refresh().disabled && refresh().getAttribute('aria-busy') === 'true', 'Refresh must be disabled while pending');
    check(refresh().querySelector('path').getAttribute('d') !== refreshPath,
        'Pending refresh must show the loading icon');
    check(getComputedStyle(refresh().querySelector('svg')).animationName ===
        (matchMedia('(prefers-reduced-motion: reduce)').matches ? 'none' : 'icon-spin'),
        'Refresh must animate unless reduced motion is requested');
    refresh().click();
    check(sent.length === requests + 1, 'Disabled Refresh must not send another request');
    reply(controllers);
    await settle();
    check(!refresh().disabled, 'An unchanged controller list must finish refresh');
    check(refresh().querySelector('path').getAttribute('d') === refreshPath &&
        getComputedStyle(refresh().querySelector('svg')).animationName === 'none',
        'Finishing refresh must restore the idle icon and stop the animation');

    const proRow = document.querySelector('.controller-pro').closest('li');
    const connectedControllers = controllers.map(controller => controller.serial === 'pro' ? {
        ...controller,state:4,rumble_enabled:true,color:'#83ceb5',battery_level:1,
        player_name:'Test player',player_id:1,player_color:[255,0,0,255],
    } : controller);
    refresh().click();
    reply(connectedControllers);
    await settle();
    check(document.querySelector('.controller-pro').closest('li') === proRow, 'Refresh must reuse the existing controller row');
    check(proRow.querySelector('.controller-state').textContent === 'Connected!', 'Fresh lists must update existing row status');
    checkActionsLayout(proRow);
    check(proRow.querySelector('.controller-rumble-button').getAttribute('aria-pressed') === 'true', 'Fresh lists must update action buttons');
    check(proRow.querySelector('svg path').getAttribute('fill') === '#83ceb5' && proRow.querySelector('.battery-level').classList.contains('critical'), 'Fresh lists must update colors and battery');
    check(proRow.querySelector('.player-info').textContent.includes('Test player'), 'Fresh lists must update player details');
    check(proRow.querySelector('.player-color'), 'Legacy player colors must still render');
    window.mitty.emit(updateEvent, {...connectedControllers[2],player_id:2,is_main_player:true});
    await settle();
    check(proRow.querySelector('.player-role')?.textContent === 'Main' && proRow.querySelector('.player-info').textContent.includes('P2:'), 'Navigation takeover must show Main while preserving the game player number');
    window.mitty.emit(updateEvent, {...connectedControllers[2],player_id:1,is_main_player:false});
    await settle();
    check(!proRow.querySelector('.player-role') && proRow.querySelector('.player-info').textContent.includes('P1:'), 'A returning player 1 must not show Main without navigation control');
    window.mitty.emit(updateEvent, {...connectedControllers[2],state:10,is_main_player:true});
    await settle();
    check(!proRow.querySelector('.player-role'), 'Disconnected controllers must not show Main');
    reply(controllers);
    await settle();
    check(proRow.querySelector('.controller-state').textContent === 'Idle' && !proRow.querySelector('.player-info'), 'New snapshots must clear omitted player details and restore Idle');
    window.testSocket.onmessage({data:JSON.stringify({cmd:updateEvent,data:{...controllers[2],state:4,rumble_enabled:true}})});
    await settle();
    window.mitty.emit('update_code', '654321');
    await settle();
    check(proRow.querySelector('.controller-state').textContent === 'Connected!', 'Unrelated parent updates must preserve live controller state');
    reply(controllers);
    await settle();

    refresh().click();
    reply([]);
    await settle();
    check(!refresh().disabled && listeners(updateEvent) === 0, 'Empty response must finish refresh and remove row listeners');
    for (let cycle = 0; cycle < 4; cycle++) {
        reply(controllers);
        await settle();
        check(listeners(updateEvent) === 3, 'Remounted rows must not accumulate listeners');
        check(listeners(settingsEvent) === 3, 'Remounted settings must not accumulate save listeners');
        reply([]);
        await settle();
        check(listeners(updateEvent) === 0, 'Removed rows must release listeners');
        check(listeners(settingsEvent) === 0, 'Removed settings must release save listeners');
    }
    reply(controllers);
    await settle();
    window.mitty.emit(updateEvent, {...controllers[2],state:4,rumble_enabled:true,color:'#83ceb5'});
    await settle();
    check(document.querySelector('.controller-pro path').getAttribute('fill') === '#83ceb5', 'Extracted icon must receive updated colors');
    proRow.querySelector('.controller-rumble-button').click();
    check(sent.at(-1).cmd === WsCommand.TOGGLE_RUMBLE && sent.at(-1).data.enabled === false, 'Row actions must still work');

    refresh().click();
    await settle();
    window.testSocket.readyState = 3;
    window.mitty.emit('ws_disconnected');
    await settle();
    check(!refresh().disabled, 'Disconnection must finish refresh');
    check(getComputedStyle(refresh().querySelector('svg')).animationName === 'none',
        'Disconnection must stop the refresh animation');
    const beforeOffline = sent.length;
    refresh().click();
    await settle();
    check(!refresh().disabled && sent.length === beforeOffline, 'An offline request must not leave Refresh disabled');

    const oldSocket = window.testSocket;
    const realTimeout = window.setTimeout;
    const realClearTimeout = window.clearTimeout;
    const retries = new Map();
    let nextTimer = 1;
    window.setTimeout = callback => { const id = nextTimer++; retries.set(id, callback); return id; };
    window.clearTimeout = id => retries.delete(id);
    try {
        oldSocket.onerror({message:'test connection failure'});
        oldSocket.onclose({wasClean:false});
        check(retries.size === 1, 'Error followed by close must queue one retry');
        const beforeRetry = sockets.length;
        const [timer, retry] = [...retries][0];
        retries.delete(timer);
        retry();
        check(sockets.length === beforeRetry + 1, 'One retry must create one replacement socket');
        window.testSocket.onopen({});
        oldSocket.onclose({wasClean:false});
        oldSocket.onerror({message:'obsolete failure'});
        oldSocket.onmessage({data:JSON.stringify({cmd:'resp_get_controller_list',data:[]})});
        document.querySelector('.ws-status').click();
        await settle();
        check(retries.size === 0 && sockets.length === beforeRetry + 1, 'Old events and clicks on a connected status must not create more sockets');
        check(document.querySelectorAll('.controllers-list li').length === 3, 'Old socket messages must be ignored');
        reply(connectedControllers);
        await settle();
        check(document.querySelector('.controller-pro').closest('li').querySelector('.controller-state').textContent === 'Connected!', 'The list received after browser reconnection must update existing rows');
        window.testSocket.close();
        check(retries.size === 1, 'Current socket close must schedule recovery');
        document.querySelector('.ws-status').click();
        check(retries.size === 0 && sockets.length === beforeRetry + 2, 'Manual recovery must cancel the pending retry');
        document.querySelector('.ws-status').click();
        check(sockets.length === beforeRetry + 2, 'Repeated recovery clicks must reuse the active socket');
        window.testSocket.close();
        render(null, document.body);
        check(retries.size === 0, 'Unmount must cancel the pending retry');
    } finally {
        window.setTimeout = realTimeout;
        window.clearTimeout = realClearTimeout;
    }

    render(html`<${Controllers} controllers=${controllers} />`, document.body);
    const beforeUnmount = listeners('ws_disconnected');
    render(null, document.body);
    check(listeners(updateEvent) === 0 && listeners('ws_disconnected') === beforeUnmount - controllers.length - 1,
        'Unmount must release row settings and refresh listeners');
    const originalFetch = window.fetch;
    let finishSignIn;
    try {
        window.fetch = (url, options) => {
            check(url === '/jdnow/sign-in' && options.method === 'POST', 'Sign-in must use the existing endpoint');
            return new Promise(resolve => { finishSignIn = resolve; });
        };
        const guestController = {...controllers[0], jdnow_guest:'saved',
            jdnow_guests:[{key:'saved',name:'Saved dancer',controllers:['left']}]};
        render(html`<${Controllers} controllers=${[guestController]} jdnow=${true} />`, document.body);
        await settle();
        const picker = document.querySelector('.controller-tools select');
        check([...picker.options].some(option => option.value === 'sign-in' && option.textContent === 'Sign in with Ubisoft…'),
            'The JDNow guest picker must include the Ubisoft sign-in option');
        check(![...document.querySelectorAll('button')].some(button => button.textContent.includes('Sign in with Ubisoft')),
            'The separate sign-in button must be removed');
        for (const ok of [true, false]) {
            picker.value = 'sign-in';
            picker.dispatchEvent(new Event('change', {bubbles:true}));
            await settle();
            check(picker.disabled && picker.value === 'saved' && picker.getAttribute('aria-busy') === 'true',
                'Sign-in must preserve the chosen guest and disable the picker while pending');
            finishSignIn({ok,json:async () => ok ? {} : {error:'Test sign-in failure'}});
            await settle();
            check(!picker.disabled && picker.value === 'saved', 'Finishing sign-in must restore the chosen guest');
            check(document.body.textContent.includes(ok ? 'Profile imported.' : 'Test sign-in failure'),
                'Sign-in feedback must remain visible below the picker');
        }
    } finally {
        window.fetch = originalFetch;
        render(null, document.body);
    }
    render(html`<div class="container controllers"><${Controllers} controllers=${controllers} /></div><p style="text-align:center">All UI regression checks passed.</p>`, document.body);
    await settle();
    document.body.dataset.testResult = 'passed';
} catch (error) {
    document.body.dataset.testResult = 'failed';
    document.body.append(Object.assign(document.createElement('pre'), {textContent:error.stack}));
    console.error(error);
}
</script></body></html>
